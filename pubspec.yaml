name: newapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_colorpicker: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^8.2.12
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.4

flutter_native_splash:
  color: "#000000"   # black background

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: NunitoBold
      fonts:
        - asset: assets/fonts/Nunito ExtraBold.ttf
