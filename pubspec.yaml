name: newapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_colorpicker: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  fluttertoast: ^8.2.12
  flutter_screenutil: ^5.9.3
  flutter_native_splash: ^2.4.4
  animations: ^3.0.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  intl: ^0.20.2
  flutter_timezone: ^5.1.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  appwrite: 26.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/1b1ebb0d0b3b5d8b-capybara-7.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/1b1ebb0d0b3b5d8b-capybara-7.png"

flutter_native_splash:
  color: "#000000"
  image: assets/1b1ebb0d0b3b5d8b-capybara-7.png
  android_12:
    image: assets/1b1ebb0d0b3b5d8b-capybara-7.png
    icon_background_color: "#000000"
    color: "#000000"

flutter:
  uses-material-design: true

  assets:
    - assets/1b1ebb0d0b3b5d8b-capybara-7.png

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: NunitoBold
      fonts:
        - asset: assets/fonts/Nunito ExtraBold.ttf
